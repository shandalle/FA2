<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Form</title>
  <!-- Styling for form layout and appearance -->
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; }
    label { display: inline-block; width: 130px; vertical-align: top; }
    input, select { width: 240px; margin-bottom: 10px; }
    .row { margin-bottom: 8px; }
    h1, h2 { margin-bottom: 6px; }
  </style>
</head>
<body>
  
  <!-- Main order form section -->
  <h1>Order Form</h1>
  <form id="orderForm" onsubmit="return printReceipt();">
    <!-- Customer full name input -->
    <div class="row">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="fullName" required />
    </div>
    <!-- Grade and section input (or NA for Faculty/Staff) -->
    <div class="row">
      <label for="gradeSection">Grade & Section:</label>
      <input type="text" id="gradeSection" name="gradeSection" placeholder="NA for F&S" required />
    </div>
    <!-- Food menu selection with prices -->
    <div class="row">
      <label for="menuItem">Food:</label>
      <select id="menuItem" name="menuItem" required>
        <option value="Chicken meal">Chicken meal (PHP 75)</option>
        <option value="Pork meal">Pork meal (PHP 85)</option>
        <option value="Beef meal">Beef meal (PHP 105)</option>
      </select>
    </div>
    <!-- Quantity selector (limited to 5 items maximum) -->
    <div class="row">
      <label for="quantity">Quantity (Max of 5):</label>
      <input type="number" id="quantity" name="quantity" min="1" max="5" value="1" required />
    </div>
    <!-- Customer type selection for discount eligibility -->
    <div class="row">
      <label for="customerType">Customer Type:</label>
      <select id="customerType" name="customerType" required>
        <option value="Student">Student</option>
        <option value="Faculty/Staff">Faculty/Staff</option>
      </select>
    </div>
    <!-- Submit button to process the order -->
    <div class="row">
      <input type="submit" value="Place Order" />
    </div>
  </form>

  <!-- Order receipt display area -->
  <h2>ORDER SUMMARY</h2>
  <div id="receipt"></div>

  <script>
    // Calculates the subtotal based on menu item and quantity
    function calculateSubtotal(order, quantity) {
      let unitPrice;
      // Determine price based on selected food item
      switch (order) {
        case "Chicken meal":
          unitPrice = 75;
          break;
        case "Pork meal":
          unitPrice = 85;
          break;
        case "Beef meal":
          unitPrice = 105;
          break;
        default:
          return "Item not found";
      }
      return unitPrice * quantity;
    }

    // Calculates discount based on customer type (20% for students)
    function calculateDiscount(total, custType) {
      if (custType === "Student") {
        return total * 0.2;
      }
      return 0;
    }

    // Generates and displays the order receipt
    function printReceipt() {
      // Retrieve form input values
      const fullName = document.getElementById("fullName").value.trim();
      const gradeSection = document.getElementById("gradeSection").value.trim();
      const menuItem = document.getElementById("menuItem").value;
      const quantity = Number(document.getElementById("quantity").value);
      const customerType = document.getElementById("customerType").value;

      const receiptEl = document.getElementById("receipt");
      // Calculate subtotal for the order
      const subtotal = calculateSubtotal(menuItem, quantity);

      // Validate menu item selection
      if (typeof subtotal === "string") {
        receiptEl.innerHTML = "<p>" + subtotal + "</p>";
        return false;
      }

      // Calculate discount and final total
      const discount = calculateDiscount(subtotal, customerType);
      const totalDue = subtotal - discount;
      const itemPrice = subtotal / quantity;

      // Display receipt with all order details
      receiptEl.innerHTML =
        "<p>Customer: " + fullName + "</p>" +
        "<p>Grade & Section: " + gradeSection + "</p>" +
        "<p>Order: " + menuItem + " (PHP " + itemPrice.toFixed(2) + ")</p>" +
        "<p>Quantity: " + quantity + "</p>" +
        "<p>Subtotal: PHP " + subtotal.toFixed(2) + "</p>" +
        "<p>Discount: PHP " + discount.toFixed(2) + "</p>" +
        "<p><strong>Total Due: PHP " + totalDue.toFixed(2) + "</strong></p>" +
        "<p>Thank you for your patronage!</p>";

      return false;
    }
  </script>
</body>
</html>
