<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Canteen Pre-order</title>
</head>
<body>
    <h1>Canteen Pre-order Form</h1>
    <form id="orderForm">
        <div>
            <label for="fullName">Customer's Full Name:</label>
            <input type="text" id="fullName" name="fullName" required />
        </div>
        <div>
            <label for="gradeSection">Grade and Section (or NA):</label>
            <input type="text" id="gradeSection" name="gradeSection" required />
        </div>
        <div>
            <label for="menuItem">Menu Item:</label>
            <select id="menuItem" name="menuItem">
                <option value="rice">rice</option>
                <option value="viand">viand</option>
                <option value="burger">burger</option>
                <option value="juice">juice</option>
                <option value="water">water</option>
            </select>
        </div>
        <div>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required />
        </div>
        <div>
            <label for="student">
                <input type="radio" id="student" name="role" value="student" required /> Student
            </label>
            <label for="staff">
                <input type="radio" id="staff" name="role" value="staff" required /> Teacher/Staff
            </label>
        </div>
        <div>
            <button type="submit">Place Order</button>
        </div>
    </form>

    <div id="output"></div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', function (e) {
            e.preventDefault();
            calculateAmount();
        });

        function calculateAmount() {
            var item = document.getElementById('menuItem').value;
            var qty = Number(document.getElementById('quantity').value);
            var role = document.querySelector('input[name="role"]:checked').value;
            var price;

            switch (item) {
                case 'rice':
                    price = 10;
                    break;
                case 'viand':
                    price = 60;
                    break;
                case 'burger':
                    price = 45;
                    break;
                case 'juice':
                    price = 20;
                    break;
                case 'water':
                    price = 15;
                    break;
                default:
                    price = null;
            }

            var output = document.getElementById('output');
            if (price === null) {
                output.innerHTML = '<p>Item not found</p>';
                return;
            }

            var rawTotal = price * qty;
            var discount = 0;
            if (role === 'student') {
                discount = rawTotal * 0.20;
            }
            var finalTotal = rawTotal - discount;

            output.innerHTML = ''
                + '<p>Selected item: ' + item + '</p>'
                + '<p>Quantity: ' + qty + '</p>'
                + '<p>Unit price: ₱' + price.toFixed(2) + '</p>'
                + '<p>Raw total: ₱' + rawTotal.toFixed(2) + '</p>'
                + '<p>Discount: ₱' + discount.toFixed(2) + '</p>'
                + '<p><strong>Total due: ₱' + finalTotal.toFixed(2) + '</strong></p>';
        }
    </script>
</body>
</html>
